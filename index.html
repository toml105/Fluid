<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluid Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas {
    width: 100vw; height: 100vh; display: block;
    touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}

/* Controls UI */
#controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    z-index: 10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff; font-size: 12px; transition: opacity 0.3s;
    max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
}
#controls.collapsed { padding: 8px 14px; gap: 0; }
#controls.collapsed .ctrl-item { display: none; }
#controls button, #controls .toggle-btn {
    background: rgba(255,255,255,0.12); border: none; color: #fff; padding: 6px 12px;
    border-radius: 8px; font-size: 11px; cursor: pointer; white-space: nowrap;
    transition: background 0.2s;
}
#controls button:hover, #controls .toggle-btn:hover { background: rgba(255,255,255,0.25); }
#controls button:active { background: rgba(255,255,255,0.35); }
#controls .toggle-btn.active { background: rgba(100,200,255,0.3); }
.ctrl-item { display: flex; align-items: center; gap: 6px; }
.ctrl-item label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
.ctrl-item input[type="range"] {
    width: 70px; height: 4px; -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.2); border-radius: 2px; outline: none;
}
.ctrl-item input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; cursor: pointer;
}
#collapse-btn { font-size: 16px; line-height: 1; padding: 4px 8px; }
#record-btn.recording { background: rgba(255,50,50,0.5); animation: pulse-red 1s infinite; }
@keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); } 50% { box-shadow: 0 0 0 6px rgba(255,0,0,0); } }
.remote-cursor { position:fixed; width:12px; height:12px; border-radius:50%; pointer-events:none; z-index:15; border:2px solid rgba(255,255,255,0.6); transform:translate(-50%,-50%); transition:left 0.08s linear, top 0.08s linear; }

/* Permission prompt overlay */
#perm-prompt {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); backdrop-filter: blur(16px); border-radius: 16px;
    padding: 24px; color: #fff; font-family: -apple-system, sans-serif; text-align: center;
    z-index: 100; display: none; max-width: 320px;
}
#perm-prompt h3 { margin-bottom: 12px; font-size: 16px; }
#perm-prompt p { font-size: 13px; opacity: 0.8; margin-bottom: 16px; }
#perm-prompt button {
    background: rgba(100,200,255,0.3); border: none; color: #fff; padding: 10px 24px;
    border-radius: 10px; font-size: 14px; cursor: pointer; margin: 4px;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
    <button id="collapse-btn" title="Toggle controls">&#9776;</button>
    <div class="ctrl-item">
        <label>Viscosity</label>
        <input type="range" id="viscosity" min="0" max="100" value="0">
    </div>
    <div class="ctrl-item">
        <label>Vorticity</label>
        <input type="range" id="vorticity" min="0" max="100" value="30">
    </div>
    <button class="ctrl-item" id="palette-btn">Palette</button>
    <button class="ctrl-item" id="screenshot-btn">Screenshot</button>
    <button class="ctrl-item toggle-btn" id="mode-btn">Ink</button>
    <button class="ctrl-item" id="mic-btn">Mic: Off</button>
    <button class="ctrl-item" id="gyro-btn">Gyro: Off</button>
    <button class="ctrl-item toggle-btn" id="particles-btn">Particles</button>
    <button class="ctrl-item toggle-btn" id="walls-btn">Walls</button>
    <button class="ctrl-item" id="clear-walls-btn">Clear Walls</button>
    <button class="ctrl-item toggle-btn" id="wells-btn">Wells</button>
    <button class="ctrl-item toggle-btn" id="record-btn">Record</button>
    <button class="ctrl-item" id="music-btn">Music</button>
    <button class="ctrl-item" id="room-btn">Room</button>
    <button class="ctrl-item" id="battle-btn">Battle</button>
</div>

<!-- Music file input (hidden) -->
<input type="file" id="music-file" accept="audio/*" style="display:none">

<!-- Room overlay -->
<div id="room-overlay" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9); backdrop-filter:blur(16px); border-radius:16px; padding:24px;
    color:#fff; font-family:-apple-system,sans-serif; text-align:center; z-index:100; min-width:280px;">
    <h3 style="margin-bottom:16px; font-size:16px;">Multiplayer Room</h3>
    <div id="room-status" style="font-size:13px; opacity:0.8; margin-bottom:12px;"></div>
    <div id="room-code-display" style="font-size:28px; font-weight:bold; letter-spacing:4px; margin:12px 0; display:none;"></div>
    <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
        <button id="create-room-btn" style="background:rgba(100,200,255,0.3); border:none; color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; cursor:pointer;">Create Room</button>
        <button id="copy-room-btn" style="background:rgba(100,200,255,0.3); border:none; color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; cursor:pointer; display:none;">Copy Link</button>
    </div>
    <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
        <input id="join-room-input" placeholder="Room code" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 12px; border-radius:8px; font-size:14px; text-align:center; width:120px; text-transform:uppercase;">
        <button id="join-room-btn" style="background:rgba(100,200,255,0.3); border:none; color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; cursor:pointer;">Join</button>
    </div>
    <div id="room-players" style="font-size:12px; opacity:0.7; margin-top:8px;"></div>
    <button onclick="document.getElementById('room-overlay').style.display='none'" style="background:rgba(255,255,255,0.12); border:none; color:#fff; padding:8px 16px; border-radius:8px; font-size:12px; cursor:pointer; margin-top:12px;">Close</button>
</div>

<!-- Battle overlay -->
<div id="battle-overlay" style="display:none; position:fixed; top:0; left:0; right:0;
    pointer-events:none; z-index:20; font-family:-apple-system,sans-serif; color:#fff;">
    <div style="display:flex; justify-content:center; align-items:center; padding:12px; gap:16px;">
        <div id="battle-timer" style="font-size:24px; font-weight:bold; text-shadow:0 2px 8px rgba(0,0,0,0.8);"></div>
    </div>
    <div id="battle-scores" style="display:flex; justify-content:center; gap:12px; padding:0 16px;"></div>
</div>
<div id="battle-winner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:36px; font-weight:bold; color:#fff; text-shadow:0 0 20px rgba(255,255,255,0.8);
    z-index:30; font-family:-apple-system,sans-serif; pointer-events:none;"></div>

<div id="perm-prompt">
    <h3 id="perm-title">Permission Required</h3>
    <p id="perm-text"></p>
    <button id="perm-allow">Allow</button>
    <button id="perm-dismiss" onclick="document.getElementById('perm-prompt').style.display='none'">Dismiss</button>
</div>

<script>
'use strict';

// ============================================================
// SECTION 1: WebGL Utilities
// ============================================================

const canvas = document.getElementById('canvas');
let gl;
let isWebGL2 = false;
let halfFloatExt, floatLinearExt;

function getWebGLContext() {
    // Try WebGL2 first
    const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: true };
    gl = canvas.getContext('webgl2', params);
    if (gl) {
        isWebGL2 = true;
        // In WebGL2, float/half-float textures are core but rendering to them needs extension
        gl.getExtension('EXT_color_buffer_float');
        gl.getExtension('OES_texture_float_linear');
        return;
    }
    // Fallback to WebGL1
    gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    if (!gl) { alert('WebGL not supported'); return; }
    halfFloatExt = gl.getExtension('OES_texture_half_float');
    gl.getExtension('OES_texture_half_float_linear');
    floatLinearExt = gl.getExtension('OES_texture_float_linear');
    gl.getExtension('WEBGL_color_buffer_float');
}

getWebGLContext();

// Determine texture format support
const halfFloat = isWebGL2 ? gl.HALF_FLOAT : (halfFloatExt ? halfFloatExt.HALF_FLOAT_OES : gl.FLOAT);
const formatRGBA = isWebGL2 ? { internalFormat: gl.RGBA16F, format: gl.RGBA } : { internalFormat: gl.RGBA, format: gl.RGBA };
const formatRG = isWebGL2 ? { internalFormat: gl.RG16F, format: gl.RG } : { internalFormat: gl.RGBA, format: gl.RGBA };
const formatR = isWebGL2 ? { internalFormat: gl.R16F, format: gl.RED } : { internalFormat: gl.RGBA, format: gl.RGBA };

// Check if we can render to float textures by creating a test FBO
function checkRenderToTexture(internalFormat, format, type) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteTexture(tex);
    gl.deleteFramebuffer(fbo);
    return status === gl.FRAMEBUFFER_COMPLETE;
}

// Determine best texture type to use
let texType = halfFloat;
if (!checkRenderToTexture(formatRGBA.internalFormat, formatRGBA.format, halfFloat)) {
    texType = gl.FLOAT;
    if (!isWebGL2) {
        gl.getExtension('OES_texture_float');
    }
}

function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compile error:', gl.getShaderInfoLog(shader), '\nSource:', source);
    }
    return shader;
}

function createProgram(vertexSource, fragmentSource) {
    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program link error:', gl.getProgramInfoLog(program));
    }
    // Cache uniform locations
    const uniforms = {};
    const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
        const info = gl.getActiveUniform(program, i);
        uniforms[info.name] = gl.getUniformLocation(program, info.name);
    }
    program.uniforms = uniforms;
    return program;
}

// Fullscreen quad - two triangles covering the screen
const quadVAO = (() => {
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    if (isWebGL2) {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindVertexArray(null);
        return vao;
    }
    return buffer;
})();

function blit(target) {
    if (target == null) {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
        gl.viewport(0, 0, target.width, target.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    if (isWebGL2) {
        gl.bindVertexArray(quadVAO);
    } else {
        gl.bindBuffer(gl.ARRAY_BUFFER, quadVAO);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    }
    gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
}

// Create a single FBO with texture
function createFBO(w, h, internalFormat, format, type, filtering) {
    gl.activeTexture(gl.TEXTURE0);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtering);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtering);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    return { texture, fbo, width: w, height: h,
        attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; }
    };
}

// Create a double FBO for ping-pong rendering
function createDoubleFBO(w, h, internalFormat, format, type, filtering) {
    let fbo1 = createFBO(w, h, internalFormat, format, type, filtering);
    let fbo2 = createFBO(w, h, internalFormat, format, type, filtering);
    return {
        width: w, height: h,
        get read() { return fbo1; },
        get write() { return fbo2; },
        swap() { const temp = fbo1; fbo1 = fbo2; fbo2 = temp; }
    };
}

// ============================================================
// SECTION 2: Shader Sources
// ============================================================

const GLSL_PREFIX = isWebGL2
    ? '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n'
    : 'precision highp float;\nprecision highp sampler2D;\n';

const VERT_SHADER = isWebGL2 ? `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPosition;
out vec2 vUv;          // texture coordinates [0,1]
out vec2 vL, vR, vT, vB; // neighbour UVs for finite differences
uniform vec2 texelSize;   // 1.0 / resolution
void main() {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
}` : `
precision highp float;
attribute vec2 aPosition;
varying vec2 vUv;
varying vec2 vL, vR, vT, vB;
uniform vec2 texelSize;
void main() {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

// Helper to make fragment shaders work in both WebGL1 and WebGL2
function fragSource(body) {
    if (isWebGL2) {
        return '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n'
            + 'in vec2 vUv;\nin vec2 vL, vR, vT, vB;\n'
            + 'out vec4 fragColor;\n' + body;
    }
    // WebGL1: replace fragColor with gl_FragColor, in with varying
    return 'precision highp float;\nprecision highp sampler2D;\n'
        + 'varying vec2 vUv;\nvarying vec2 vL, vR, vT, vB;\n'
        + '#define fragColor gl_FragColor\n' + body;
}

// --- Clear shader: multiply field by dissipation factor ---
const clearFrag = fragSource(`
uniform sampler2D uTexture;
uniform float value;  // dissipation factor
void main() {
    fragColor = value * texture(uTexture, vUv);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Splat shader: add a Gaussian blob of colour/velocity at a point ---
const splatFrag = fragSource(`
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;      // colour or velocity to add
uniform vec2 point;      // splat centre in UV space
uniform float radius;    // splat radius
void main() {
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    // Gaussian falloff
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture(uTarget, vUv).xyz;
    fragColor = vec4(base + splat, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Advection shader: Semi-Lagrangian advection (with obstacle support) ---
const advectionFrag = fragSource(`
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform sampler2D uObstacle;
uniform vec2 texelSize;
uniform float dt;
uniform float dissipation;
void main() {
    float obs = texture(uObstacle, vUv).r;
    if (obs > 0.5) {
        fragColor = vec4(0.0);
        return;
    }
    vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
    vec4 result = dissipation * texture(uSource, coord);
    fragColor = max(result, vec4(0.0));
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Curl shader: compute vorticity (scalar curl of 2D velocity field) ---
const curlFrag = fragSource(`
uniform sampler2D uVelocity;
void main() {
    // curl = dVy/dx - dVx/dy (using central differences via neighbour UVs)
    float L = texture(uVelocity, vL).y;
    float R = texture(uVelocity, vR).y;
    float T = texture(uVelocity, vT).x;
    float B = texture(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    fragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Vorticity confinement shader: re-injects rotational energy ---
// Prevents numerical dissipation from killing vortices
const vorticityFrag = fragSource(`
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;   // vorticity confinement strength
uniform float dt;
void main() {
    float L = texture(uCurl, vL).x;
    float R = texture(uCurl, vR).x;
    float T = texture(uCurl, vT).x;
    float B = texture(uCurl, vB).x;
    float C = texture(uCurl, vUv).x;

    // Gradient of absolute vorticity (points toward vortex centres)
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    float len = length(force) + 0.0001;
    force = force / len * curl * C;

    vec2 velocity = texture(uVelocity, vUv).xy + force * dt;
    fragColor = vec4(velocity, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Divergence shader (with obstacle support) ---
const divergenceFrag = fragSource(`
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
void main() {
    float oL = texture(uObstacle, vL).r;
    float oR = texture(uObstacle, vR).r;
    float oT = texture(uObstacle, vT).r;
    float oB = texture(uObstacle, vB).r;
    float L = oL > 0.5 ? 0.0 : texture(uVelocity, vL).x;
    float R = oR > 0.5 ? 0.0 : texture(uVelocity, vR).x;
    float T = oT > 0.5 ? 0.0 : texture(uVelocity, vT).y;
    float B = oB > 0.5 ? 0.0 : texture(uVelocity, vB).y;
    float div = 0.5 * (R - L + T - B);
    fragColor = vec4(div, 0.0, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Pressure solver (with obstacle Neumann boundaries) ---
const pressureFrag = fragSource(`
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform sampler2D uObstacle;
void main() {
    float C = texture(uPressure, vUv).x;
    float oL = texture(uObstacle, vL).r;
    float oR = texture(uObstacle, vR).r;
    float oT = texture(uObstacle, vT).r;
    float oB = texture(uObstacle, vB).r;
    float L = oL > 0.5 ? C : texture(uPressure, vL).x;
    float R = oR > 0.5 ? C : texture(uPressure, vR).x;
    float T = oT > 0.5 ? C : texture(uPressure, vT).x;
    float B = oB > 0.5 ? C : texture(uPressure, vB).x;
    float div = texture(uDivergence, vUv).x;
    float pressure = (L + R + B + T - div) * 0.25;
    fragColor = vec4(pressure, 0.0, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Gradient subtraction (with obstacle support) ---
const gradientSubtractFrag = fragSource(`
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
void main() {
    float obs = texture(uObstacle, vUv).r;
    if (obs > 0.5) {
        fragColor = vec4(0.0, 0.0, 0.0, 1.0);
        return;
    }
    float L = texture(uPressure, vL).x;
    float R = texture(uPressure, vR).x;
    float T = texture(uPressure, vT).x;
    float B = texture(uPressure, vB).x;
    vec2 velocity = texture(uVelocity, vUv).xy;
    velocity -= vec2(R - L, T - B);
    fragColor = vec4(velocity, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Display shader (Ink mode): render dye field to screen with glow ---
const displayFrag = fragSource(`
uniform sampler2D uTexture;
uniform sampler2D uBloom;
uniform float bloomIntensity;
void main() {
    vec3 color = texture(uTexture, vUv).rgb;
    vec3 bloom = texture(uBloom, vUv).rgb;
    color += bloom * bloomIntensity;
    // Subtle tone mapping for cinematic look
    color = color / (1.0 + color);
    // Slight gamma correction
    color = pow(color, vec3(1.0 / 2.2));
    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Display shader (no bloom fallback) ---
const displayNoBloomFrag = fragSource(`
uniform sampler2D uTexture;
void main() {
    vec3 color = texture(uTexture, vUv).rgb;
    color = color / (1.0 + color);
    color = pow(color, vec3(1.0 / 2.2));
    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- CFD display shader: scientific visualization of velocity & pressure ---
const displayCFDFrag = fragSource(`
uniform sampler2D uVelocity;
uniform sampler2D uPressure;
uniform vec2 texelSize;
void main() {
    vec2 vel = texture(uVelocity, vUv).xy;
    float pres = texture(uPressure, vUv).x;

    // Scientific colourmap for pressure (blue -> cyan -> green -> yellow -> red)
    float p = clamp(pres * 2.0 + 0.5, 0.0, 1.0);
    vec3 color;
    if (p < 0.25) {
        color = mix(vec3(0.0, 0.0, 0.5), vec3(0.0, 0.5, 1.0), p * 4.0);
    } else if (p < 0.5) {
        color = mix(vec3(0.0, 0.5, 1.0), vec3(0.0, 1.0, 0.5), (p - 0.25) * 4.0);
    } else if (p < 0.75) {
        color = mix(vec3(0.0, 1.0, 0.5), vec3(1.0, 1.0, 0.0), (p - 0.5) * 4.0);
    } else {
        color = mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), (p - 0.75) * 4.0);
    }

    // Velocity magnitude overlay (brightness)
    float speed = length(vel);
    color *= 0.5 + 0.5 * clamp(speed * 5.0, 0.0, 1.0);

    // Velocity arrows: draw on a grid
    vec2 cellSize = vec2(1.0 / 40.0); // 40x40 grid of arrows
    vec2 cell = floor(vUv / cellSize);
    vec2 cellCentre = (cell + 0.5) * cellSize;
    vec2 localPos = (vUv - cellCentre) / cellSize; // [-0.5, 0.5]

    // Sample velocity at cell centre
    vec2 cellVel = texture(uVelocity, cellCentre).xy;
    float cellSpeed = length(cellVel);
    vec2 dir = cellSpeed > 0.001 ? cellVel / cellSpeed : vec2(0.0);

    // Draw arrow as a line from centre in velocity direction
    float arrowLen = clamp(cellSpeed * 8.0, 0.05, 0.4);

    // Distance from point to line segment (centre to tip)
    vec2 tip = dir * arrowLen;
    vec2 toPoint = localPos;
    float t = clamp(dot(toPoint, tip) / dot(tip, tip), 0.0, 1.0);
    vec2 closest = tip * t;
    float dist = length(toPoint - closest);

    // Arrow shaft
    float arrow = smoothstep(0.04, 0.02, dist);

    // Arrow head (triangle at tip)
    vec2 headPos = localPos - tip;
    vec2 perp = vec2(-dir.y, dir.x);
    float headDot = dot(headPos, -dir);
    float headPerp = abs(dot(headPos, perp));
    float headShape = step(0.0, headDot) * step(headDot, 0.12) * step(headPerp, headDot * 1.2);
    arrow = max(arrow, headShape);

    color = mix(color, vec3(1.0), arrow * 0.8);

    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Bloom threshold shader: extract bright areas ---
const bloomThresholdFrag = fragSource(`
uniform sampler2D uTexture;
uniform float threshold;
void main() {
    vec3 color = texture(uTexture, vUv).rgb;
    float brightness = max(color.r, max(color.g, color.b));
    float contribution = max(0.0, brightness - threshold) / max(brightness, 0.001);
    fragColor = vec4(color * contribution, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Bloom blur shader: separable Gaussian blur ---
const bloomBlurFrag = fragSource(`
uniform sampler2D uTexture;
uniform vec2 direction;  // (1,0) for horizontal, (0,1) for vertical
uniform vec2 texelSize;
void main() {
    // 9-tap Gaussian blur
    vec3 color = vec3(0.0);
    float weights[5];
    weights[0] = 0.227027;
    weights[1] = 0.1945946;
    weights[2] = 0.1216216;
    weights[3] = 0.054054;
    weights[4] = 0.016216;

    vec2 off = direction * texelSize;
    color += texture(uTexture, vUv).rgb * weights[0];
    for (int i = 1; i < 5; i++) {
        float w = weights[i];
        color += texture(uTexture, vUv + off * float(i)).rgb * w;
        color += texture(uTexture, vUv - off * float(i)).rgb * w;
    }
    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Bloom composite shader: blend bloom onto original ---
const bloomCompositeFrag = fragSource(`
uniform sampler2D uTexture;
uniform sampler2D uBloom0;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform float bloomIntensity;
void main() {
    vec3 color = texture(uTexture, vUv).rgb;
    vec3 bloom = texture(uBloom0, vUv).rgb * 0.5
               + texture(uBloom1, vUv).rgb * 0.3
               + texture(uBloom2, vUv).rgb * 0.2;
    color += bloom * bloomIntensity;
    color = color / (1.0 + color); // tone map
    color = pow(color, vec3(1.0 / 2.2)); // gamma
    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');


// --- Obstacle draw shader: draws a filled circle into obstacle texture ---
const obstacleDrawFrag = fragSource(`
uniform vec2 point;
uniform float radius;
uniform float aspectRatio;
uniform float erase;  // 0.0 = draw, 1.0 = erase
uniform sampler2D uTexture;
void main() {
    vec2 p = vUv - point;
    p.x *= aspectRatio;
    float d = length(p);
    float existing = texture(uTexture, vUv).r;
    float circle = smoothstep(radius, radius * 0.8, d);
    float result;
    if (erase > 0.5) {
        result = existing * (1.0 - circle);
    } else {
        result = max(existing, circle);
    }
    fragColor = vec4(result, 0.0, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Obstacle display overlay shader ---
const obstacleDisplayFrag = fragSource(`
uniform sampler2D uObstacle;
uniform sampler2D uScene;
void main() {
    vec3 scene = texture(uScene, vUv).rgb;
    float obs = texture(uObstacle, vUv).r;
    // Semi-transparent white overlay for obstacles
    vec3 color = mix(scene, vec3(0.3, 0.35, 0.4), obs * 0.6);
    fragColor = vec4(color, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Gravity well force shader ---
const wellForceFrag = fragSource(`
uniform sampler2D uVelocity;
uniform vec2 wells[8];       // well positions in UV space
uniform float wellStrengths[8]; // positive = attract, negative = repel
uniform int wellCount;
uniform float dt;
uniform float aspectRatio;
void main() {
    vec2 vel = texture(uVelocity, vUv).xy;
    for (int i = 0; i < 8; i++) {
        if (i >= wellCount) break;
        vec2 diff = wells[i] - vUv;
        diff.x *= aspectRatio;
        float dist = length(diff) + 0.001;
        vec2 dir = diff / dist;
        // Inverse-square falloff, capped
        float force = wellStrengths[i] / (dist * dist + 0.01);
        force = clamp(force, -500.0, 500.0);
        vel += dir * force * dt;
    }
    fragColor = vec4(vel, 0.0, 1.0);
}
`).replace(/texture\(/g, isWebGL2 ? 'texture(' : 'texture2D(');

// --- Particle vertex shader ---
const particleVS = isWebGL2 ? `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPosition;
layout(location = 1) in vec4 aColor;
layout(location = 2) in float aLife;
out vec4 vColor;
out float vLife;
void main() {
    vColor = aColor;
    vLife = aLife;
    gl_Position = vec4(aPosition * 2.0 - 1.0, 0.0, 1.0);
    gl_PointSize = mix(1.0, 4.0, vLife);
}` : `
precision highp float;
attribute vec2 aPosition;
attribute vec4 aColor;
attribute float aLife;
varying vec4 vColor;
varying float vLife;
void main() {
    vColor = aColor;
    vLife = aLife;
    gl_Position = vec4(aPosition * 2.0 - 1.0, 0.0, 1.0);
    gl_PointSize = mix(1.0, 4.0, vLife);
}`;

const particleFS = isWebGL2 ? `#version 300 es
precision highp float;
in vec4 vColor;
in float vLife;
out vec4 fragColor;
void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float alpha = smoothstep(1.0, 0.3, d) * vLife;
    fragColor = vec4(vColor.rgb, alpha);
}` : `
precision highp float;
varying vec4 vColor;
varying float vLife;
void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float alpha = smoothstep(1.0, 0.3, d) * vLife;
    gl_FragColor = vec4(vColor.rgb, alpha);
}`;

// SECTION 3: Simulation Config
// ============================================================

const config = {
    SIM_RESOLUTION: 128,    // simulation grid (will be scaled by aspect ratio)
    DYE_RESOLUTION: 1024,   // dye rendering resolution
    PRESSURE_ITERATIONS: 20,
    CURL: 15,               // vorticity confinement strength
    SPLAT_RADIUS: 0.25,     // radius of splat in screen fraction
    SPLAT_FORCE: 6000,
    VELOCITY_DISSIPATION: 0.2,
    DENSITY_DISSIPATION: 1.0,
    PRESSURE_DISSIPATION: 0.8,
    BLOOM_INTENSITY: 0.4,
    BLOOM_THRESHOLD: 0.6,
    CFD_MODE: false,
    VISCOSITY: 0,
    paletteIndex: 0,
    PARTICLES_ENABLED: false,
    WALLS_MODE: false,
    WELLS_MODE: false,
    WALL_RADIUS: 0.015,
};

// Colour palettes
const PALETTES = [
    // Vivid
    [[0.94, 0.13, 0.55], [0.0, 0.87, 0.87], [0.95, 0.87, 0.13], [0.29, 0.87, 0.13], [0.95, 0.55, 0.13], [0.95, 0.29, 0.66]],
    // Ocean
    [[0.05, 0.1, 0.6], [0.0, 0.5, 0.6], [0.0, 0.8, 0.85], [0.3, 0.9, 0.7], [0.7, 0.9, 0.95]],
    // Fire
    [[0.85, 0.1, 0.05], [0.95, 0.5, 0.05], [1.0, 0.9, 0.1], [1.0, 1.0, 0.8], [0.5, 0.05, 0.02]],
    // Neon
    [[1.0, 0.1, 0.5], [0.1, 0.5, 1.0], [0.1, 1.0, 0.3], [0.6, 0.1, 0.9], [1.0, 1.0, 0.1]],
    // Pastel
    [[0.95, 0.7, 0.75], [0.7, 0.65, 0.95], [0.65, 0.95, 0.75], [0.95, 0.8, 0.65], [0.65, 0.8, 0.95]]
];

let colorIndex = 0;
function getNextColor() {
    const palette = PALETTES[config.paletteIndex];
    const c = palette[colorIndex % palette.length];
    colorIndex++;
    return { r: c[0], g: c[1], b: c[2] };
}

function randomColor() {
    const palette = PALETTES[config.paletteIndex];
    const c = palette[Math.floor(Math.random() * palette.length)];
    return { r: c[0], g: c[1], b: c[2] };
}

// SECTION 4: WebGL Initialization
// ============================================================

// Compile all shader programs
const programs = {
    clear: createProgram(VERT_SHADER, clearFrag),
    splat: createProgram(VERT_SHADER, splatFrag),
    advection: createProgram(VERT_SHADER, advectionFrag),
    curl: createProgram(VERT_SHADER, curlFrag),
    vorticity: createProgram(VERT_SHADER, vorticityFrag),
    divergence: createProgram(VERT_SHADER, divergenceFrag),
    pressure: createProgram(VERT_SHADER, pressureFrag),
    gradientSubtract: createProgram(VERT_SHADER, gradientSubtractFrag),
    displayNoBloom: createProgram(VERT_SHADER, displayNoBloomFrag),
    displayCFD: createProgram(VERT_SHADER, displayCFDFrag),
    bloomThreshold: createProgram(VERT_SHADER, bloomThresholdFrag),
    bloomBlur: createProgram(VERT_SHADER, bloomBlurFrag),
    bloomComposite: createProgram(VERT_SHADER, bloomCompositeFrag),
    obstacleDraw: createProgram(VERT_SHADER, obstacleDrawFrag),
    obstacleDisplay: createProgram(VERT_SHADER, obstacleDisplayFrag),
    wellForce: createProgram(VERT_SHADER, wellForceFrag),
    particle: createProgram(particleVS, particleFS),
};

// FBOs - will be initialized in initFBOs
let velocity, pressure, divergence, curlFBO, dye;
let bloomFBOs = []; // downsampled FBOs for bloom chain
let obstacleFBO; // obstacle texture

function getResolution(resolution) {
    let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
    const min = Math.round(resolution);
    const max = Math.round(resolution * aspectRatio);
    if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
    return { width: min, height: max };
}

function initFBOs() {
    const simRes = getResolution(config.SIM_RESOLUTION);
    const dyeRes = getResolution(config.DYE_RESOLUTION);

    const simW = simRes.width, simH = simRes.height;
    const dyeW = dyeRes.width, dyeH = dyeRes.height;

    velocity = createDoubleFBO(simW, simH, formatRG.internalFormat, formatRG.format, texType, gl.LINEAR);
    pressure = createDoubleFBO(simW, simH, formatR.internalFormat, formatR.format, texType, gl.NEAREST);
    divergence = createFBO(simW, simH, formatR.internalFormat, formatR.format, texType, gl.NEAREST);
    curlFBO = createFBO(simW, simH, formatR.internalFormat, formatR.format, texType, gl.NEAREST);
    dye = createDoubleFBO(dyeW, dyeH, formatRGBA.internalFormat, formatRGBA.format, texType, gl.LINEAR);

    // Obstacle FBO (sim resolution, RGBA8)
    obstacleFBO = createFBO(simW, simH, isWebGL2 ? gl.RGBA8 : gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);

    // Bloom FBOs: progressively downsampled
    bloomFBOs = [];
    let bw = Math.floor(dyeW / 2), bh = Math.floor(dyeH / 2);
    for (let i = 0; i < 3; i++) {
        bloomFBOs.push({
            a: createFBO(bw, bh, formatRGBA.internalFormat, formatRGBA.format, texType, gl.LINEAR),
            b: createFBO(bw, bh, formatRGBA.internalFormat, formatRGBA.format, texType, gl.LINEAR)
        });
        bw = Math.floor(bw / 2);
        bh = Math.floor(bh / 2);
    }
}

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        initFBOs();
    }
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));


// ============================================================
// SECTION 5: Input Handling
// ============================================================

// Active pointers (mouse + multi-touch)
const pointers = new Map();

function getPointerData(id) {
    if (!pointers.has(id)) {
        pointers.set(id, { x: 0, y: 0, prevX: 0, prevY: 0, dx: 0, dy: 0, down: false, moved: false, color: getNextColor() });
    }
    return pointers.get(id);
}

function updatePointerPosition(id, x, y) {
    const p = getPointerData(id);
    p.prevX = p.x;
    p.prevY = p.y;
    p.x = x / window.innerWidth;
    p.y = 1.0 - y / window.innerHeight;
    p.dx = p.x - p.prevX;
    p.dy = p.y - p.prevY;
    p.moved = Math.abs(p.dx) > 0 || Math.abs(p.dy) > 0;
}

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const p = getPointerData(e.pointerId);
    p.down = true;
    p.color = getNextColor();
    updatePointerPosition(e.pointerId, e.clientX, e.clientY);
    p.moved = false; // Don't splat on just click-down, wait for move
    // But do a small splat at the touch point
    splatPointer(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    const p = getPointerData(e.pointerId);
    if (!p.down) return;
    updatePointerPosition(e.pointerId, e.clientX, e.clientY);
});

canvas.addEventListener('pointerup', (e) => {
    const p = getPointerData(e.pointerId);
    if (p) p.down = false;
});

canvas.addEventListener('pointerleave', (e) => {
    const p = getPointerData(e.pointerId);
    if (p) p.down = false;
});

// Prevent default touch behaviours
canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// Gyroscope
let gyroEnabled = false;
let gyroX = 0, gyroY = 0;

function initGyroscope() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        // iOS 13+ requires permission
        DeviceMotionEvent.requestPermission().then(state => {
            if (state === 'granted') {
                window.addEventListener('devicemotion', handleMotion);
                gyroEnabled = true;
                document.getElementById('gyro-btn').textContent = 'Gyro: On';
            } else {
                document.getElementById('gyro-btn').textContent = 'Gyro: Denied';
            }
        }).catch(() => {
            document.getElementById('gyro-btn').textContent = 'Gyro: N/A';
        });
    } else if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', handleMotion);
        gyroEnabled = true;
        document.getElementById('gyro-btn').textContent = 'Gyro: On';
    } else {
        document.getElementById('gyro-btn').textContent = 'Gyro: N/A';
    }
}

function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    // Normalize and smooth
    gyroX = (acc.x || 0) * 0.5;
    gyroY = (acc.y || 0) * 0.5;
}

// Microphone
let micEnabled = false;
let audioAmplitude = 0;
let audioContext, analyser, micStream;

async function initMicrophone() {
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        micEnabled = true;
        document.getElementById('mic-btn').textContent = 'Mic: On';
    } catch (err) {
        console.warn('Microphone access denied:', err);
        document.getElementById('mic-btn').textContent = 'Mic: Denied';
    }
}

function updateAudioAmplitude() {
    if (!micEnabled || !analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    audioAmplitude = sum / data.length / 255.0; // Normalized 0-1
}

function stopMicrophone() {
    if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
    }
    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }
    micEnabled = false;
    audioAmplitude = 0;
    document.getElementById('mic-btn').textContent = 'Mic: Off';
}


// ============================================================
// SECTION 5b: Particle System
// ============================================================

const MAX_PARTICLES = 15000;
const particlePositions = new Float32Array(MAX_PARTICLES * 2);
const particleColors = new Float32Array(MAX_PARTICLES * 4);
const particleLives = new Float32Array(MAX_PARTICLES);
let particleCount = 0;
let particlePosBuffer, particleColBuffer, particleLifeBuffer, particleVAO;

function initParticleBuffers() {
    particlePosBuffer = gl.createBuffer();
    particleColBuffer = gl.createBuffer();
    particleLifeBuffer = gl.createBuffer();
    if (isWebGL2) {
        particleVAO = gl.createVertexArray();
        gl.bindVertexArray(particleVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleColBuffer);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleLifeBuffer);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
        gl.bindVertexArray(null);
    }
}
initParticleBuffers();

function spawnParticle(x, y, r, g, b) {
    if (particleCount >= MAX_PARTICLES) {
        // Recycle oldest particle
        const idx = Math.floor(Math.random() * MAX_PARTICLES);
        particlePositions[idx * 2] = x;
        particlePositions[idx * 2 + 1] = y;
        particleColors[idx * 4] = r;
        particleColors[idx * 4 + 1] = g;
        particleColors[idx * 4 + 2] = b;
        particleColors[idx * 4 + 3] = 1.0;
        particleLives[idx] = 1.0;
        return;
    }
    const i = particleCount;
    particlePositions[i * 2] = x;
    particlePositions[i * 2 + 1] = y;
    particleColors[i * 4] = r;
    particleColors[i * 4 + 1] = g;
    particleColors[i * 4 + 2] = b;
    particleColors[i * 4 + 3] = 1.0;
    particleLives[i] = 1.0;
    particleCount++;
}

// Read velocity at low res for particle advection (CPU fallback)
let velocityReadback = null;
let velReadW = 0, velReadH = 0;

function readVelocityField() {
    // Read a small version of velocity for CPU particle advection
    velReadW = Math.min(velocity.read.width, 128);
    velReadH = Math.min(velocity.read.height, 128);
    if (!velocityReadback || velocityReadback.length !== velReadW * velReadH * 4) {
        velocityReadback = new Float32Array(velReadW * velReadH * 4);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, velocity.read.fbo);
    gl.readPixels(0, 0, velReadW, velReadH, gl.RGBA, gl.FLOAT, velocityReadback);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function sampleVelocity(x, y) {
    if (!velocityReadback) return [0, 0];
    const px = Math.floor(x * (velReadW - 1));
    const py = Math.floor(y * (velReadH - 1));
    const idx = (py * velReadW + px) * 4;
    return [velocityReadback[idx] || 0, velocityReadback[idx + 1] || 0];
}

function updateParticles(dt) {
    if (!config.PARTICLES_ENABLED || particleCount === 0) return;

    // Read velocity field for advection
    try { readVelocityField(); } catch(e) { /* readPixels may fail on some formats */ }

    const texelW = 1.0 / velocity.read.width;
    const texelH = 1.0 / velocity.read.height;
    let alive = 0;

    for (let i = 0; i < particleCount; i++) {
        particleLives[i] -= dt * 0.3; // fade over ~3 seconds
        if (particleLives[i] <= 0) continue;

        const x = particlePositions[i * 2];
        const y = particlePositions[i * 2 + 1];
        const [vx, vy] = sampleVelocity(x, y);

        particlePositions[i * 2] += vx * texelW * dt;
        particlePositions[i * 2 + 1] += vy * texelH * dt;

        // Keep alive particle
        if (alive !== i) {
            particlePositions[alive * 2] = particlePositions[i * 2];
            particlePositions[alive * 2 + 1] = particlePositions[i * 2 + 1];
            particleColors[alive * 4] = particleColors[i * 4];
            particleColors[alive * 4 + 1] = particleColors[i * 4 + 1];
            particleColors[alive * 4 + 2] = particleColors[i * 4 + 2];
            particleColors[alive * 4 + 3] = particleColors[i * 4 + 3];
            particleLives[alive] = particleLives[i];
        }
        alive++;
    }
    particleCount = alive;
}

function renderParticles() {
    if (!config.PARTICLES_ENABLED || particleCount === 0) return;

    const prog = programs.particle;
    gl.useProgram(prog);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive blend

    if (isWebGL2) {
        gl.bindVertexArray(particleVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particlePositions.subarray(0, particleCount * 2), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleColBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particleColors.subarray(0, particleCount * 4), gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleLifeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particleLives.subarray(0, particleCount), gl.DYNAMIC_DRAW);
    } else {
        gl.bindBuffer(gl.ARRAY_BUFFER, particlePosBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particlePositions.subarray(0, particleCount * 2), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleColBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particleColors.subarray(0, particleCount * 4), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, particleLifeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particleLives.subarray(0, particleCount), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
    }

    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.drawArrays(gl.POINTS, 0, particleCount);
    gl.disable(gl.BLEND);

    if (isWebGL2) gl.bindVertexArray(null);
}

// ============================================================
// SECTION 5c: Gravity Wells
// ============================================================

const wells = []; // {x, y, strength}
let wellPlaceTimer = null;
let wellPlacePos = null;

function addWell(x, y, strength) {
    if (wells.length >= 8) wells.shift(); // max 8 wells
    wells.push({ x, y, strength: strength || 200 });
    broadcastMessage({ type: 'well', action: 'add', x, y, strength: strength || 200 });
}

function removeWellNear(x, y) {
    const threshold = 0.05;
    for (let i = wells.length - 1; i >= 0; i--) {
        const dx = wells[i].x - x;
        const dy = wells[i].y - y;
        if (Math.sqrt(dx * dx + dy * dy) < threshold) {
            wells.splice(i, 1);
            broadcastMessage({ type: 'well', action: 'remove', x, y });
            return true;
        }
    }
    return false;
}

function applyWellForces(dt) {
    if (wells.length === 0) return;
    const prog = programs.wellForce;
    gl.useProgram(prog);
    gl.uniform2f(prog.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(prog.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1f(prog.uniforms.dt, dt);
    gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform1i(prog.uniforms.wellCount, wells.length);
    for (let i = 0; i < 8; i++) {
        if (i < wells.length) {
            gl.uniform2f(prog.uniforms[`wells[${i}]`], wells[i].x, wells[i].y);
            gl.uniform1f(prog.uniforms[`wellStrengths[${i}]`], wells[i].strength);
        } else {
            gl.uniform2f(prog.uniforms[`wells[${i}]`], 0, 0);
            gl.uniform1f(prog.uniforms[`wellStrengths[${i}]`], 0);
        }
    }
    blit(velocity.write);
    velocity.swap();
}

// ============================================================
// SECTION 5d: Obstacle Drawing
// ============================================================

function drawObstacle(x, y, erase) {
    const prog = programs.obstacleDraw;
    gl.useProgram(prog);
    gl.uniform1i(prog.uniforms.uTexture, obstacleFBO.attach(0));
    gl.uniform2f(prog.uniforms.point, x, y);
    gl.uniform1f(prog.uniforms.radius, config.WALL_RADIUS);
    gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform1f(prog.uniforms.erase, erase ? 1.0 : 0.0);
    // Need a temp FBO to avoid read/write same texture
    const tempObs = createFBO(obstacleFBO.width, obstacleFBO.height,
        isWebGL2 ? gl.RGBA8 : gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
    blit(tempObs);
    // Copy back
    gl.useProgram(programs.clear);
    gl.uniform1i(programs.clear.uniforms.uTexture, tempObs.attach(0));
    gl.uniform1f(programs.clear.uniforms.value, 1.0);
    blit(obstacleFBO);
    // Clean up temp
    gl.deleteTexture(tempObs.texture);
    gl.deleteFramebuffer(tempObs.fbo);
    broadcastMessage({ type: 'obstacle', x, y, radius: config.WALL_RADIUS, erase: !!erase });
}

function clearObstacles() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, obstacleFBO.fbo);
    gl.viewport(0, 0, obstacleFBO.width, obstacleFBO.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

function startRecording() {
    try {
        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fluid-' + Date.now() + '.webm';
            a.click();
            URL.revokeObjectURL(url);
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('record-btn').classList.add('recording');
        document.getElementById('record-btn').textContent = 'Stop';
    } catch (e) {
        // Fallback: try without codec specification
        try {
            const stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'fluid-' + Date.now() + '.webm';
                a.click();
                URL.revokeObjectURL(url);
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('record-btn').classList.add('recording');
            document.getElementById('record-btn').textContent = 'Stop';
        } catch (e2) {
            console.warn('Recording not supported:', e2);
            alert('Recording not supported in this browser');
        }
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('record-btn').classList.remove('recording');
        document.getElementById('record-btn').textContent = 'Record';
    }
}

// ============================================================
// SECTION 5f: Multiplayer (WebRTC via PeerJS)
// ============================================================

let peer = null;
let connections = []; // DataConnection[]
let roomCode = '';
let isHost = false;
let remoteCursors = {}; // peerId -> {x, y, color, element}
let peerJSLoaded = false;

function loadPeerJS() {
    return new Promise((resolve, reject) => {
        if (peerJSLoaded || typeof Peer !== 'undefined') { peerJSLoaded = true; resolve(); return; }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
        script.onload = () => { peerJSLoaded = true; resolve(); };
        script.onerror = () => reject(new Error('Failed to load PeerJS'));
        document.head.appendChild(script);
    });
}

function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
}

async function createRoom() {
    await loadPeerJS();
    roomCode = generateRoomCode();
    const peerId = 'fluid-' + roomCode;
    document.getElementById('room-status').textContent = 'Creating room...';

    peer = new Peer(peerId, { debug: 0 });
    peer.on('open', () => {
        isHost = true;
        document.getElementById('room-status').textContent = 'Room created! Share the code:';
        document.getElementById('room-code-display').textContent = roomCode;
        document.getElementById('room-code-display').style.display = 'block';
        document.getElementById('copy-room-btn').style.display = 'inline-block';
        document.getElementById('room-btn').textContent = roomCode;
        updatePlayerCount();
    });
    peer.on('connection', (conn) => {
        setupConnection(conn);
    });
    peer.on('error', (err) => {
        document.getElementById('room-status').textContent = 'Error: ' + err.type;
        console.error('PeerJS error:', err);
    });
}

async function joinRoom(code) {
    await loadPeerJS();
    roomCode = code.toUpperCase();
    const myId = 'fluid-' + roomCode + '-' + Math.random().toString(36).substr(2, 4);
    document.getElementById('room-status').textContent = 'Connecting...';

    peer = new Peer(myId, { debug: 0 });
    peer.on('open', () => {
        const conn = peer.connect('fluid-' + roomCode, { reliable: true });
        setupConnection(conn);
    });
    peer.on('error', (err) => {
        document.getElementById('room-status').textContent = 'Error: ' + err.type;
    });
}

function setupConnection(conn) {
    conn.on('open', () => {
        connections.push(conn);
        document.getElementById('room-status').textContent = 'Connected!';
        document.getElementById('room-btn').textContent = roomCode || 'Connected';
        updatePlayerCount();

        // Send our colour identity
        const col = randomColor();
        conn.send(JSON.stringify({ type: 'identity', color: col }));
    });
    conn.on('data', (data) => {
        try {
            const msg = typeof data === 'string' ? JSON.parse(data) : data;
            handleRemoteMessage(msg, conn.peer);
        } catch (e) {}
    });
    conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        removeRemoteCursor(conn.peer);
        updatePlayerCount();
    });
}

function handleRemoteMessage(msg, peerId) {
    switch (msg.type) {
        case 'splat':
            splat(msg.x, msg.y, msg.dx, msg.dy, msg.color);
            break;
        case 'cursor':
            updateRemoteCursor(peerId, msg.x, msg.y, msg.color);
            break;
        case 'well':
            if (msg.action === 'add') wells.push({ x: msg.x, y: msg.y, strength: msg.strength });
            else removeWellNear(msg.x, msg.y);
            break;
        case 'obstacle':
            // Draw obstacle locally without re-broadcasting
            const prog = programs.obstacleDraw;
            gl.useProgram(prog);
            gl.uniform1i(prog.uniforms.uTexture, obstacleFBO.attach(0));
            gl.uniform2f(prog.uniforms.point, msg.x, msg.y);
            gl.uniform1f(prog.uniforms.radius, msg.radius);
            gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
            gl.uniform1f(prog.uniforms.erase, msg.erase ? 1.0 : 0.0);
            const tmp = createFBO(obstacleFBO.width, obstacleFBO.height,
                isWebGL2 ? gl.RGBA8 : gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
            blit(tmp);
            gl.useProgram(programs.clear);
            gl.uniform1i(programs.clear.uniforms.uTexture, tmp.attach(0));
            gl.uniform1f(programs.clear.uniforms.value, 1.0);
            blit(obstacleFBO);
            gl.deleteTexture(tmp.texture);
            gl.deleteFramebuffer(tmp.fbo);
            break;
        case 'battle-start':
            startBattleLocal(msg.teams);
            break;
        case 'identity':
            // Store remote player color
            break;
    }
}

function broadcastMessage(msg) {
    if (connections.length === 0) return;
    const data = JSON.stringify(msg);
    for (const conn of connections) {
        try { conn.send(data); } catch (e) {}
    }
}

function updateRemoteCursor(peerId, x, y, color) {
    if (!remoteCursors[peerId]) {
        const el = document.createElement('div');
        el.className = 'remote-cursor';
        el.style.background = `rgb(${Math.floor(color.r*255)},${Math.floor(color.g*255)},${Math.floor(color.b*255)})`;
        document.body.appendChild(el);
        remoteCursors[peerId] = { el, x: 0, y: 0 };
    }
    const cursor = remoteCursors[peerId];
    cursor.x = x;
    cursor.y = y;
    cursor.el.style.left = (x * window.innerWidth) + 'px';
    cursor.el.style.top = ((1 - y) * window.innerHeight) + 'px';
}

function removeRemoteCursor(peerId) {
    if (remoteCursors[peerId]) {
        remoteCursors[peerId].el.remove();
        delete remoteCursors[peerId];
    }
}

function updatePlayerCount() {
    const count = connections.length + 1;
    document.getElementById('room-players').textContent = count + ' player' + (count > 1 ? 's' : '') + ' connected';
}

// ============================================================
// SECTION 5g: Paint Battle Mode
// ============================================================

let battleActive = false;
let battleTimer = 0;
let battleTeams = [];
let battleScores = {};
const BATTLE_DURATION = 60; // seconds

function startBattle() {
    const teams = [
        { name: 'Red', color: { r: 1.0, g: 0.15, b: 0.15 } },
        { name: 'Blue', color: { r: 0.15, g: 0.3, b: 1.0 } },
    ];
    // Add more teams if more players
    if (connections.length >= 2) {
        teams.push({ name: 'Green', color: { r: 0.15, g: 1.0, b: 0.3 } });
    }
    if (connections.length >= 3) {
        teams.push({ name: 'Yellow', color: { r: 1.0, g: 0.9, b: 0.15 } });
    }

    broadcastMessage({ type: 'battle-start', teams });
    startBattleLocal(teams);
}

function startBattleLocal(teams) {
    battleTeams = teams;
    battleTimer = BATTLE_DURATION;
    battleActive = true;
    battleScores = {};
    teams.forEach(t => battleScores[t.name] = 0);

    // Assign local player a team
    const myTeamIdx = isHost ? 0 : Math.min(connections.length, teams.length - 1);
    const myTeam = teams[myTeamIdx % teams.length];

    // Override pointer colours to team colour
    for (const [, p] of pointers) {
        p.color = { ...myTeam.color };
        p.teamName = myTeam.name;
    }

    // Clear dye
    gl.useProgram(programs.clear);
    gl.uniform1i(programs.clear.uniforms.uTexture, dye.read.attach(0));
    gl.uniform1f(programs.clear.uniforms.value, 0.0);
    blit(dye.write);
    dye.swap();

    document.getElementById('battle-overlay').style.display = 'block';
    updateBattleUI();
}

function updateBattle(dt) {
    if (!battleActive) return;
    battleTimer -= dt;
    if (battleTimer <= 0) {
        battleTimer = 0;
        endBattle();
    }
    updateBattleUI();

    // Score sampling every ~1 second
    if (Math.floor((battleTimer + dt) * 1) !== Math.floor(battleTimer * 1)) {
        sampleBattleScores();
    }
}

function sampleBattleScores() {
    // Read a tiny version of the dye texture
    const w = 64, h = 64;
    const pixels = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
    try {
        gl.readPixels(0, 0, Math.min(w, dye.read.width), Math.min(h, dye.read.height), gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    } catch(e) { return; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    // Count pixels closest to each team colour
    const counts = {};
    battleTeams.forEach(t => counts[t.name] = 0);
    const total = w * h;

    for (let i = 0; i < total; i++) {
        const r = pixels[i * 4] / 255;
        const g = pixels[i * 4 + 1] / 255;
        const b = pixels[i * 4 + 2] / 255;
        if (r + g + b < 0.05) continue; // skip black

        let bestTeam = null;
        let bestDist = Infinity;
        for (const t of battleTeams) {
            const dr = r - t.color.r;
            const dg = g - t.color.g;
            const db = b - t.color.b;
            const dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) { bestDist = dist; bestTeam = t.name; }
        }
        if (bestTeam && bestDist < 0.5) counts[bestTeam]++;
    }
    battleScores = counts;
}

function updateBattleUI() {
    document.getElementById('battle-timer').textContent = Math.ceil(battleTimer) + 's';
    const scoresDiv = document.getElementById('battle-scores');
    scoresDiv.innerHTML = '';
    for (const t of battleTeams) {
        const score = battleScores[t.name] || 0;
        const total = Object.values(battleScores).reduce((a, b) => a + b, 0) || 1;
        const pct = Math.round(score / total * 100);
        const bar = document.createElement('div');
        bar.style.cssText = `background:rgb(${Math.floor(t.color.r*255)},${Math.floor(t.color.g*255)},${Math.floor(t.color.b*255)}); padding:4px 12px; border-radius:8px; font-size:14px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,0.5); min-width:60px; text-align:center;`;
        bar.textContent = t.name + ' ' + pct + '%';
        scoresDiv.appendChild(bar);
    }
}

function endBattle() {
    battleActive = false;
    sampleBattleScores();
    updateBattleUI();

    // Find winner
    let winner = battleTeams[0];
    let maxScore = 0;
    for (const t of battleTeams) {
        if ((battleScores[t.name] || 0) > maxScore) {
            maxScore = battleScores[t.name];
            winner = t;
        }
    }

    // Show winner
    const winnerEl = document.getElementById('battle-winner');
    winnerEl.textContent = winner.name + ' Wins!';
    winnerEl.style.color = `rgb(${Math.floor(winner.color.r*255)},${Math.floor(winner.color.g*255)},${Math.floor(winner.color.b*255)})`;
    winnerEl.style.display = 'block';

    // Celebration splats
    for (let i = 0; i < 20; i++) {
        setTimeout(() => {
            const angle = Math.random() * Math.PI * 2;
            const force = 3000 + Math.random() * 5000;
            splat(0.5, 0.5, Math.cos(angle) * force, Math.sin(angle) * force, winner.color);
        }, i * 100);
    }

    setTimeout(() => {
        winnerEl.style.display = 'none';
        document.getElementById('battle-overlay').style.display = 'none';
        // Restore normal pointer colours
        for (const [, p] of pointers) { p.color = getNextColor(); delete p.teamName; }
    }, 5000);
}

// ============================================================
// SECTION 5h: Music Visualizer (Full FFT)
// ============================================================

let musicMode = false;
let audioSource = null;
let audioElement = null;
let prevBassEnergy = 0;

function initMusicFromFile(file) {
    if (audioElement) { audioElement.pause(); audioElement = null; }
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();

    audioElement = new Audio();
    audioElement.src = URL.createObjectURL(file);
    audioElement.crossOrigin = 'anonymous';

    if (audioSource) audioSource.disconnect();
    audioSource = audioContext.createMediaElementSource(audioElement);
    if (!analyser) {
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
    }
    audioSource.connect(analyser);
    analyser.connect(audioContext.destination); // play through speakers too

    audioElement.play();
    musicMode = true;
    document.getElementById('music-btn').textContent = 'Music: On';
}

function getMusicBands() {
    if (!analyser) return { bass: 0, mid: 0, high: 0 };
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);

    const binCount = data.length;
    // Bass: first 10% of bins, Mid: 10-40%, High: 40-100%
    const bassEnd = Math.floor(binCount * 0.1);
    const midEnd = Math.floor(binCount * 0.4);

    let bass = 0, mid = 0, high = 0;
    for (let i = 0; i < binCount; i++) {
        const v = data[i] / 255;
        if (i < bassEnd) bass += v;
        else if (i < midEnd) mid += v;
        else high += v;
    }
    bass /= bassEnd || 1;
    mid /= (midEnd - bassEnd) || 1;
    high /= (binCount - midEnd) || 1;

    return { bass, mid, high };
}

function applyMusicVisualization() {
    if (!musicMode && !micEnabled) return;

    const bands = getMusicBands();
    if (!bands) return;

    // Beat detection (bass energy spike)
    const bassEnergy = bands.bass;
    const bassDelta = bassEnergy - prevBassEnergy;
    prevBassEnergy = bassEnergy * 0.9 + prevBassEnergy * 0.1; // smooth

    // Bass → large slow splats from edges
    if (bands.bass > 0.3) {
        const edge = Math.random();
        let x, y, dx, dy;
        if (edge < 0.25) { x = 0; y = Math.random(); dx = bands.bass * 4000; dy = 0; }
        else if (edge < 0.5) { x = 1; y = Math.random(); dx = -bands.bass * 4000; dy = 0; }
        else if (edge < 0.75) { x = Math.random(); y = 0; dx = 0; dy = bands.bass * 4000; }
        else { x = Math.random(); y = 1; dx = 0; dy = -bands.bass * 4000; }
        splat(x, y, dx, dy, randomColor());
    }

    // Mid → swirling vortices
    if (bands.mid > 0.25) {
        const angle = Math.random() * Math.PI * 2;
        const force = bands.mid * 3000;
        splat(0.2 + Math.random() * 0.6, 0.2 + Math.random() * 0.6,
            Math.cos(angle) * force, Math.sin(angle) * force, randomColor());
    }

    // High → fine spray
    if (bands.high > 0.2) {
        for (let i = 0; i < 3; i++) {
            const angle = Math.random() * Math.PI * 2;
            const force = bands.high * 1500;
            splat(Math.random(), Math.random(),
                Math.cos(angle) * force, Math.sin(angle) * force, randomColor());
        }
    }

    // Beat burst from centre
    if (bassDelta > 0.15) {
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            splat(0.5, 0.5, Math.cos(angle) * 6000, Math.sin(angle) * 6000, randomColor());
        }
    }
}

// ============================================================
// SECTION 6: Simulation Step
// ============================================================

function splatPointer(id) {
    const p = pointers.get(id);
    if (!p) return;
    const dx = p.dx * config.SPLAT_FORCE;
    const dy = p.dy * config.SPLAT_FORCE;
    splat(p.x, p.y, dx, dy, p.color);
}

function splat(x, y, dx, dy, color) {
    const prog = programs.splat;
    gl.useProgram(prog);
    gl.uniform1i(prog.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(prog.uniforms.point, x, y);
    gl.uniform3f(prog.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(prog.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(prog.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(prog.uniforms.color, color.r * 0.3, color.g * 0.3, color.b * 0.3);
    blit(dye.write);
    dye.swap();
}

function correctRadius(radius) {
    const aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) return radius * aspectRatio;
    return radius;
}

function step(dt) {
    // Process pointer splats
    for (const [id, p] of pointers) {
        if (p.down && p.moved) {
            splatPointer(id);
            // Spawn particles at pointer
            if (config.PARTICLES_ENABLED) {
                for (let i = 0; i < 5; i++) {
                    spawnParticle(
                        p.x + (Math.random() - 0.5) * 0.02,
                        p.y + (Math.random() - 0.5) * 0.02,
                        p.color.r, p.color.g, p.color.b
                    );
                }
            }
            // Broadcast cursor for multiplayer
            broadcastMessage({ type: 'cursor', x: p.x, y: p.y, color: p.color });
            p.moved = false;
        }

        // Obstacle drawing mode
        if (config.WALLS_MODE && p.down) {
            drawObstacle(p.x, p.y, false);
        }
    }

    // Apply gravity wells
    applyWellForces(dt);

    // Apply gyroscope as global force
    if (gyroEnabled && (Math.abs(gyroX) > 0.5 || Math.abs(gyroY) > 0.5)) {
        const prog = programs.splat;
        gl.useProgram(prog);
        gl.uniform1i(prog.uniforms.uTarget, velocity.read.attach(0));
        gl.uniform1f(prog.uniforms.aspectRatio, canvas.width / canvas.height);
        gl.uniform2f(prog.uniforms.point, 0.5, 0.5);
        gl.uniform3f(prog.uniforms.color, gyroX * 200, gyroY * 200, 0.0);
        gl.uniform1f(prog.uniforms.radius, correctRadius(1.0));
        blit(velocity.write);
        velocity.swap();
    }

    // Music visualizer
    applyMusicVisualization();

    // Audio-driven turbulence (basic mic mode, when not in music mode)
    if (micEnabled && !musicMode && audioAmplitude > 0.05) {
        const intensity = audioAmplitude * 3.0;
        const count = Math.floor(intensity * 3) + 1;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const force = intensity * config.SPLAT_FORCE * 0.5;
            splat(Math.random(), Math.random(),
                Math.cos(angle) * force, Math.sin(angle) * force, randomColor());
        }
    }

    // --- Curl ---
    gl.useProgram(programs.curl);
    gl.uniform2f(programs.curl.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.curl.uniforms.uVelocity, velocity.read.attach(0));
    blit(curlFBO);

    // --- Vorticity confinement ---
    gl.useProgram(programs.vorticity);
    gl.uniform2f(programs.vorticity.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.vorticity.uniforms.uCurl, curlFBO.attach(1));
    gl.uniform1f(programs.vorticity.uniforms.curl, config.CURL);
    gl.uniform1f(programs.vorticity.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    // --- Advect velocity (with obstacle) ---
    gl.useProgram(programs.advection);
    gl.uniform2f(programs.advection.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uSource, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uObstacle, obstacleFBO.attach(2));
    gl.uniform1f(programs.advection.uniforms.dt, dt);
    gl.uniform1f(programs.advection.uniforms.dissipation, 1.0 / (1.0 + config.VELOCITY_DISSIPATION * dt));
    blit(velocity.write);
    velocity.swap();

    // --- Advect dye (with obstacle) ---
    gl.useProgram(programs.advection);
    gl.uniform2f(programs.advection.uniforms.texelSize, 1.0 / dye.read.width, 1.0 / dye.read.height);
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uSource, dye.read.attach(1));
    gl.uniform1i(programs.advection.uniforms.uObstacle, obstacleFBO.attach(2));
    gl.uniform1f(programs.advection.uniforms.dissipation, 1.0 / (1.0 + config.DENSITY_DISSIPATION * dt));
    blit(dye.write);
    dye.swap();

    // --- Divergence (with obstacle) ---
    gl.useProgram(programs.divergence);
    gl.uniform2f(programs.divergence.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.divergence.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.divergence.uniforms.uObstacle, obstacleFBO.attach(1));
    blit(divergence);

    // --- Clear pressure ---
    gl.useProgram(programs.clear);
    gl.uniform1i(programs.clear.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(programs.clear.uniforms.value, config.PRESSURE_DISSIPATION);
    blit(pressure.write);
    pressure.swap();

    // --- Pressure solve (with obstacle) ---
    gl.useProgram(programs.pressure);
    gl.uniform1i(programs.pressure.uniforms.uDivergence, divergence.attach(0));
    gl.uniform1i(programs.pressure.uniforms.uObstacle, obstacleFBO.attach(2));
    for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
        gl.uniform2f(programs.pressure.uniforms.texelSize, 1.0 / pressure.read.width, 1.0 / pressure.read.height);
        gl.uniform1i(programs.pressure.uniforms.uPressure, pressure.read.attach(1));
        blit(pressure.write);
        pressure.swap();
    }

    // --- Gradient subtraction (with obstacle) ---
    gl.useProgram(programs.gradientSubtract);
    gl.uniform2f(programs.gradientSubtract.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.gradientSubtract.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(programs.gradientSubtract.uniforms.uVelocity, velocity.read.attach(1));
    gl.uniform1i(programs.gradientSubtract.uniforms.uObstacle, obstacleFBO.attach(2));
    blit(velocity.write);
    velocity.swap();

    // Update particles
    updateParticles(dt);

    // Update battle
    updateBattle(dt);
}


// ============================================================
// SECTION 7: Rendering
// ============================================================

function render() {
    if (config.CFD_MODE) {
        renderCFD();
    } else {
        renderInk();
    }
}

function renderInk() {
    // Apply bloom
    applyBloom(dye.read);

    // Final composite with bloom
    gl.useProgram(programs.bloomComposite);
    gl.uniform1i(programs.bloomComposite.uniforms.uTexture, dye.read.attach(0));
    gl.uniform1i(programs.bloomComposite.uniforms.uBloom0, bloomFBOs[0].a.attach(1));
    gl.uniform1i(programs.bloomComposite.uniforms.uBloom1, bloomFBOs[1].a.attach(2));
    gl.uniform1i(programs.bloomComposite.uniforms.uBloom2, bloomFBOs[2].a.attach(3));
    gl.uniform1f(programs.bloomComposite.uniforms.bloomIntensity, config.BLOOM_INTENSITY);
    blit(null); // render to screen

    // Render particles on top
    renderParticles();

    // Render well indicators
    renderWellIndicators();
}

function applyBloom(source) {
    // Step 1: Threshold - extract bright areas
    gl.useProgram(programs.bloomThreshold);
    gl.uniform1i(programs.bloomThreshold.uniforms.uTexture, source.attach(0));
    gl.uniform1f(programs.bloomThreshold.uniforms.threshold, config.BLOOM_THRESHOLD);
    blit(bloomFBOs[0].a);

    // Step 2: Progressive downsample + blur
    for (let i = 0; i < bloomFBOs.length; i++) {
        const bf = bloomFBOs[i];
        const src = i === 0 ? bf.a : bloomFBOs[i - 1].a;

        // Downsample (if not first, copy from previous level)
        if (i > 0) {
            gl.useProgram(programs.bloomThreshold);
            gl.uniform1i(programs.bloomThreshold.uniforms.uTexture, bloomFBOs[i - 1].a.attach(0));
            gl.uniform1f(programs.bloomThreshold.uniforms.threshold, 0.0); // pass-through
            blit(bf.a);
        }

        // Horizontal blur
        gl.useProgram(programs.bloomBlur);
        gl.uniform1i(programs.bloomBlur.uniforms.uTexture, bf.a.attach(0));
        gl.uniform2f(programs.bloomBlur.uniforms.direction, 1.0, 0.0);
        gl.uniform2f(programs.bloomBlur.uniforms.texelSize, 1.0 / bf.a.width, 1.0 / bf.a.height);
        blit(bf.b);

        // Vertical blur
        gl.uniform1i(programs.bloomBlur.uniforms.uTexture, bf.b.attach(0));
        gl.uniform2f(programs.bloomBlur.uniforms.direction, 0.0, 1.0);
        blit(bf.a);
    }
}

function renderCFD() {
    gl.useProgram(programs.displayCFD);
    gl.uniform2f(programs.displayCFD.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
    gl.uniform1i(programs.displayCFD.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.displayCFD.uniforms.uPressure, pressure.read.attach(1));
    blit(null);

    // Render particles on top in CFD mode too
    renderParticles();
    renderWellIndicators();
}

function renderWellIndicators() {
    if (wells.length === 0) return;
    // Render well positions as pulsing circles using CSS overlays
    // (keeping it simple — no extra shaders needed)

// SECTION 9: Main Loop
// ============================================================

// Well indicator dots (managed via DOM for simplicity)
let wellDots = [];
function renderWellDots() {
    // Sync DOM dots with wells array
    while (wellDots.length < wells.length) {
        const dot = document.createElement('div');
        dot.style.cssText = 'position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;z-index:12;border:2px solid rgba(255,255,255,0.8);background:rgba(100,200,255,0.3);transform:translate(-50%,-50%);';
        document.body.appendChild(dot);
        wellDots.push(dot);
    }
    while (wellDots.length > wells.length) {
        wellDots.pop().remove();
    }
    for (let i = 0; i < wells.length; i++) {
        const w = wells[i];
        wellDots[i].style.left = (w.x * window.innerWidth) + 'px';
        wellDots[i].style.top = ((1 - w.y) * window.innerHeight) + 'px';
        const pulse = 0.8 + 0.4 * Math.sin(performance.now() * 0.005 + i);
        wellDots[i].style.transform = `translate(-50%,-50%) scale(${pulse})`;
        wellDots[i].style.borderColor = w.strength > 0 ? 'rgba(100,200,255,0.8)' : 'rgba(255,100,100,0.8)';
    }
}

let lastTime = 0;

function animate(time) {
    requestAnimationFrame(animate);

    // Compute delta time, capped to prevent huge jumps
    const dt = Math.min((time - lastTime) / 1000, 0.016667);
    lastTime = time;

    if (dt <= 0) return;

    updateAudioAmplitude();

    // Run simulation
    step(dt);

    // Render to screen
    render();

    // Render well position indicators as simple dots
    renderWellDots();
}

// Generate a few initial splats so the screen isn't blank
function generateInitialSplats() {
    const count = Math.floor(Math.random() * 3) + 3;
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = 1500 + Math.random() * 3000;
        const color = randomColor();
        splat(
            0.2 + Math.random() * 0.6,
            0.2 + Math.random() * 0.6,
            Math.cos(angle) * force,
            Math.sin(angle) * force,
            color
        );
    }
}

generateInitialSplats();
requestAnimationFrame(animate);
